[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # output: export 정적 산출물 — Next 런타임 플러그인 비활성
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Exact 301s first. More specific paths before parents. Force so static HTML does not win.
[[redirects]]
  from = "/menu3-3/clitoris"
  to = "https://www.trinityclinic.co.kr/clitoroplasty"
  status = 301
  force = true

